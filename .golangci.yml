version: "2"

run:
  # The binary shipped by golangci-lint-action may be built with an older Go
  # toolchain than the go directive in go.mod (go 1.26). Pin the analysis
  # target so the build-vs-target version check does not fail CI.
  go: "1.24"

linters:
  enable:
    - staticcheck
    - ineffassign
    - unused
    - govet
  settings:
    staticcheck:
      checks:
        - all
        # Error strings are intentionally kept identical to the upstream
        # RAILGUN TypeScript SDK for cross-implementation parity, so the
        # Go-style error-string rule is disabled.
        - -ST1005
        # Several Native()/Parse helpers use explicit struct literals to stay
        # decoupled from field ordering across mirrored types.
        - -S1016
